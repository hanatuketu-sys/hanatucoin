[project]
name = 'hanatucoin'
description = 'Hanatucoin (HANA) - A Stacks SIP-010 Fungible Token'
authors = ['Anthony']
telemetry = true
cache_dir = './.cache'
requirements = []
[contracts.hanatucoin]
path = 'contracts/hanatucoin.clar'
clarity_version = 3
epoch = 'latest'
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
